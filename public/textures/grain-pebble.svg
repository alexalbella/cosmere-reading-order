<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!-- Pebbled leather grain: lit fractal noise, for soft-light. Tileable.
       A flat surface (0.85 under this light) lands on mid-grey, so the colour is kept and only the relief is added.
       The table keeps the shadows of the grain and holds its highlights (never past 0.57), for the text's sake. -->
  <filter id="f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feDiffuseLighting surfaceScale="0.9" diffuseConstant="1" lighting-color="#fff"><feDistantLight azimuth="225" elevation="58"/></feDiffuseLighting>
    <feComponentTransfer><feFuncR type="table" tableValues="0 0 0 0 0 0 0.034 0.077 0.119 0.162 0.204 0.247 0.289 0.332 0.374 0.417 0.459 0.5 0.525 0.55 0.57"/><feFuncG type="table" tableValues="0 0 0 0 0 0 0.034 0.077 0.119 0.162 0.204 0.247 0.289 0.332 0.374 0.417 0.459 0.5 0.525 0.55 0.57"/><feFuncB type="table" tableValues="0 0 0 0 0 0 0.034 0.077 0.119 0.162 0.204 0.247 0.289 0.332 0.374 0.417 0.459 0.5 0.525 0.55 0.57"/></feComponentTransfer>
  </filter>
  <rect width="300" height="300" filter="url(#f)"/>
</svg>
